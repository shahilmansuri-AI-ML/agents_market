services:

  db:
    image: postgres:15
    container_name: pod2_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_123
      POSTGRES_DB: agent_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d agent_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agents_network

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://admin:admin_123@db:5432/agent_db
    networks:
      - agents_network

  frontend:
    build: ./frontend
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8001
    networks:
      - agents_network

volumes:
  postgres_data:


networks:
  agents_network:
    name: agents_network